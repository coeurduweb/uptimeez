# UptimeEZ over Docker: two services, and the second one is the one people forget.
#
# ------------------------------------------------------------------------------
#   docker compose up -d
#   then http://localhost:8080/install.php
# ------------------------------------------------------------------------------
#
# WHY TWO SERVICES AND NOT ONE. A container that only serves pages gives you an
# installation that opens, shows everything green, and monitors nothing: that is the most
# misleading state this product can be in. Scheduling is therefore a service of its own,
# visible in "docker compose ps", whose absence can be seen.
#
# The loop is one line and replaces a cron daemon on purpose: its output goes to standard
# output, so "docker compose logs planificateur" shows what is happening. A cron inside a
# container writes to a file nobody reads, and its silence looks like normal operation.

services:
  web:
    build: .
    ports:
      # THE PORT CHANGES WITHOUT TOUCHING THIS FILE: "PORT=8090 docker compose up -d".
      # 8080 is already taken on many development machines, and Docker's error in that
      # case talks about "endpoint" and "networking", which sends you looking for a
      # network problem where you only need another number.
      - "${PORT:-8080}:80"
    volumes:
      # ONE VOLUME, AND THE CONFIGURATION LIVES IN IT TOO. That is what UPTIMEEZ_CONFIG
      # below is for: without it, config.php would be written at the root of the image,
      # therefore lost on the first rebuild, and the installation would silently start
      # over with an intact database and a forgotten password.
      - donnees:/var/www/html/data
    environment:
      UPTIMEEZ_CONFIG: /var/www/html/data/config.php
      # The timezone decides the time written in incidents and reports: the image
      # defaults to UTC, and a client report two hours off is a report you read three
      # times.
      TZ: ${TZ:-Europe/Paris}
    # THE FILE MUST EXIST, EVEN EMPTY, BEFORE THE INSTALLER OPENS IT.
    # UPTIMEEZ_CONFIG never falls back to the config.php at the root, and that is
    # deliberate: a fallback would serve another instance's database and secrets. So we
    # create it at startup, overwriting nothing if it is already there.
    command: >
      sh -c '[ -f /var/www/html/data/config.php ] || printf "<?php return [];\n" > /var/www/html/data/config.php;
             chown -R www-data:www-data /var/www/html/data;
             exec apache2-foreground'
    restart: unless-stopped

  planificateur:
    build: .
    depends_on:
      - web
    volumes:
      - donnees:/var/www/html/data
    environment:
      UPTIMEEZ_CONFIG: /var/www/html/data/config.php
      TZ: ${TZ:-Europe/Paris}
    # ONE PASS PER MINUTE, AND THE ENGINE PICKS THE MONITORS THAT ARE DUE: this is the
    # same rule as the crontab line in the documentation, and the same interval whatever
    # check rates are configured.
    command: >
      sh -c 'while true; do php /var/www/html/cron.php || true; sleep 60; done'
    restart: unless-stopped

volumes:
  donnees:
