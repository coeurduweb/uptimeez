name: Bug report
description: Something in the interface or the engine does not do what it says.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: attendu
    attributes:
      label: What you expected, and what happened instead
    validations: {required: true}
  - type: textarea
    id: reproduire
    attributes:
      label: How to reproduce it
      description: Numbered steps. If it only happens on one site, say what is unusual about it.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version, PHP, database, hosting
      placeholder: "1.4.0, PHP 8.2, SQLite, shared hosting"
    validations: {required: true}
  - type: textarea
    id: selftest
    attributes:
      label: Output of `php bin/selftest.php`
      description: Only the failing lines and the final count. It runs offline in a few seconds.
      render: text
